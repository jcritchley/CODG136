<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Web Cartography Lab: Google Maps & Alpine.js</title>
    <meta name='viewport' content='initial-scale=1, maximum-scale=1, user-scalable=no' />

    <!-- Alpine.js loaded in <head> with 'defer' to ensure it initializes after DOM is parsed -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; }
        
        .control-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: white;
            padding: 12px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>

<!-- x-data initializes the reactive component scope for this element and its children -->
<body x-data="mapApp()">

    <!-- Control Panel -->
    <div class="control-panel">
        <!-- x-text dynamically binds the span text content to the JS 'opacity' variable -->
        <label>Opacity: <span x-text="opacity + '%'"></span></label>
        
        <!-- 
          - x-model.number: Two-way data binding; keeps input value synced to JS state as a number.
          - @input: Event listener shorthand; triggers updateOpacity() on every slider tick.
        -->
        <input type="range" min="0" max="100" 
               x-model.number="opacity" 
               @input="updateOpacity()" style="width: 100%;">
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <script>
        let orthoTileType = null; // Global reference for the map overlay type

        function initMap() {
            // Initialize Google Map centered on Toronto
            const map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 43.6532, lng: -79.3832 },
                zoom: 13,
                mapTypeId: 'roadmap'
            });

            // Create custom ImageMapType using coordinate callback for direct tiles
            orthoTileType = new google.maps.ImageMapType({
                getTileUrl: function(coord, zoom) {
                    return `https://gis.toronto.ca/arcgis/rest/services/basemap/cot_ortho_2022_color_8cm/MapServer/tile/${zoom}/${coord.y}/${coord.x}`;
                },
                tileSize: new google.maps.Size(256, 256),
                isPng: true,
                opacity: 0.5,
                name: 'Toronto Orthophoto'
            });

            // Push tile layer into Google Maps overlay stack
            map.overlayMapTypes.push(orthoTileType);
        }

        // Alpine.js component state
        document.addEventListener('alpine:init', () => {
            Alpine.data('mapApp', () => ({
                opacity: 50, // Initial state variable matching range default
                updateOpacity() {
                    // Update Google Maps overlay opacity whenever Alpine state changes
                    if (orthoTileType) {
                        orthoTileType.setOpacity(this.opacity / 100);
                    }
                }
            }));
        });
    </script>

    <!-- Google Maps API loaded at bottom with callback to initMap -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?callback=initMap"></script>
</body>
</html>
