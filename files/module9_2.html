<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Web Cartography Lab: Google Maps & Alpine.js</title>
    <meta name='viewport' content='initial-scale=1, maximum-scale=1, user-scalable=no' />

    <!-- Tailwind CSS for styling the control panel -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>

<body class="flex flex-col h-screen overflow-hidden" x-data="mapApp()">

    <!-- Control Panel Powered by Alpine.js -->
    <div class="absolute top-4 right-4 z-[1000] bg-white/90 backdrop-blur p-4 rounded-lg shadow-lg w-80 space-y-3">
        <h2 class="font-bold text-gray-800 text-sm">City of Toronto Orthophoto</h2>
        <p class="text-xs text-gray-600">High-resolution aerial imagery served via ArcGIS MapServer tile endpoint.</p>
        
        <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">
                Opacity: <span x-text="opacity + '%'"></span>
            </label>
            <!-- Reactive binding to update Google Maps tile layer opacity instantly -->
            <input type="range" min="0" max="100" 
                   x-model.number="opacity" 
                   @input="updateOpacity()"
                   class="w-full accent-blue-600">
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <script>
        let orthoTileType = null;

        function initMap() {
            // Initialize Google Map centered on Toronto
            const map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 43.6532, lng: -79.3832 },
                zoom: 13,
                mapTypeId: 'roadmap'
            });

            // Create custom ImageMapType for City of Toronto direct tiles
            orthoTileType = new google.maps.ImageMapType({
                getTileUrl: function(coord, zoom) {
                    return `https://gis.toronto.ca/arcgis/rest/services/basemap/cot_ortho_2022_color_8cm/MapServer/tile/${zoom}/${coord.y}/${coord.x}`;
                },
                tileSize: new google.maps.Size(256, 256),
                isPng: true,
                opacity: 0.5,
                name: 'Toronto Orthophoto'
            });

            // Push tile layer into Google Maps overlay stack
            map.overlayMapTypes.push(orthoTileType);
        }

        // Alpine.js application state for global scope synchronization
        document.addEventListener('alpine:init', () => {
            Alpine.data('mapApp', () => ({
                opacity: 50,
                updateOpacity() {
                    if (orthoTileType) {
                        orthoTileType.setOpacity(this.opacity / 100);
                    }
                }
            }));
        });
    </script>

    <!-- Linking to the Google Maps API with callback -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?callback=initMap"></script>
</body>
</html>
