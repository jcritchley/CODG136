<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Web Cartography Lab: Google Maps & Alpine.js</title>
    <meta name='viewport' content='initial-scale=1, maximum-scale=1, user-scalable=no' />

    <!-- Alpine.js loaded in <head> with 'defer' -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; }
        
        .control-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: white;
            padding: 12px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body x-data="mapApp()">

    <!-- Control Panel -->
    <div class="control-panel">
        <label>Opacity: <span x-text="opacity + '%'"></span></label>
        <input type="range" min="0" max="100" 
               x-model.number="opacity" 
               @input="updateOpacity()" style="width: 100%;">
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <script>
        // Global callback triggered automatically once Google Maps API finishes loading
        function initMap() {
            window.dispatchEvent(new CustomEvent('gmaps-loaded'));
        }

        document.addEventListener('alpine:init', () => {
            Alpine.data('mapApp', () => ({
                opacity: 50,
                map: null,
                orthoLayer: null,

                init() {
                    // Listen for the Google Maps API ready event before building the map
                    window.addEventListener('gmaps-loaded', () => {
                        this.map = new google.maps.Map(document.getElementById("map"), {
                            center: { lat: 43.6532, lng: -79.3832 },
                            zoom: 13,
                            mapTypeId: 'roadmap'
                        });

                        this.orthoLayer = new google.maps.ImageMapType({
                            getTileUrl: function(coord, zoom) {
                                return `https://gis.toronto.ca/arcgis/rest/services/basemap/cot_ortho_2022_color_8cm/MapServer/tile/${zoom}/${coord.y}/${coord.x}`;
                            },
                            tileSize: new google.maps.Size(256, 256),
                            isPng: true,
                            opacity: this.opacity / 100,
                            name: 'Toronto Orthophoto'
                        });

                        this.map.overlayMapTypes.push(this.orthoLayer);
                    });
                },

                updateOpacity() {
                    if (this.orthoLayer) {
                        this.orthoLayer.setOpacity(this.opacity / 100);
                    }
                }
            }));
        });
    </script>

    <!-- Google Maps API loaded with initialization callback -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?callback=initMap"></script>
</body>
</html>
