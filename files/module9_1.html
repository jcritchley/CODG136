<!DOCTYPE html>
<html>

<head>

<meta charset=utf-8 />
<title>Leaflet Slider Example</title>

<meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />

    <!--Link to Leaflet CSS document-->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!--Linking to Alpine.js via CDN-->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<style>

    body {
        margin: 0;
        padding: 0;
    }

    #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
    }

    #slider {
        width: 100%;
        margin: 10px 0;
    }

    section {
        position: absolute;
        right: 10px;
        width: 400px;
        margin: 20px auto;
        padding: 0 15px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid grey;
        border-radius: 3px;
        z-index: 800;
    }

    p {
        font-size: .9em;
        line-height: 1.5em;
    }

    @media screen and (max-width:768px) {
        body {
            overflow: hidden
        }

        section {
            width: 85%;
            bottom: 15px;
            max-height: 300px;
            overflow: auto;
        }
    }

</style>

</head>

<body>
    <div id='map'></div>

    <!-- Alpine.js component container tracking opacity state -->
    <section x-data="{ opacity: 50 }">
        <h2>City of Toronto - Orthorectified Aerial Imagery</h2>

        <p>WMS layer displays Orthorectified Aerial Imagery for the City of Toronto, from <a href="https://open.toronto.ca/dataset/web-map-services/">the City of Toronto Open Data portal</a>.</p>

        <!-- Native range slider bound to Alpine state -->
        <input id="slider" type="range" min="0" max="100" x-model="opacity" @input="satellite.setOpacity(opacity / 100)">

        <p>Use the slider to adjust the satellite imagery opacity. Current opacity: <span x-text="opacity"></span>%</p>
    </section>

    <script>

        var map = L.map('map', {
            center: [43.652526, -79.382674],
            zoom: 13
        });
          
        // Free community OSM raster tiles 
        L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '&copy; OpenStreetMap France | &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

		// Direct ArcGIS MapServer tile layer for Toronto orthophotos
        var satellite = L.tileLayer('https://gis.toronto.ca/arcgis/rest/services/basemap/cot_ortho_2022_color_8cm/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 20,
            opacity: 0.5,
            attribution: '&copy; City of Toronto GIS'
        }).addTo(map);
		
    </script>
</body>
</html>
