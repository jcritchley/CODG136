<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Cartography Lab: Leaflet & Alpine.js</title>
    
    <!-- Leaflet CSS loaded in <head> so the map container styles render instantly -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Alpine.js loaded in <head> with 'defer' to ensure it initializes after DOM is parsed -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; }
        
        .control-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: white;
            padding: 12px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>

<!-- x-data initializes the reactive component scope for this element and its children -->
<body x-data="mapApp()">

    <!-- Control Panel -->
    <div class="control-panel">
        <!-- x-text dynamically binds the span text content to the JS 'opacity' variable -->
        <label>Opacity: <span x-text="opacity + '%'"></span></label>
        
        <!-- 
          - x-model.number: Two-way data binding; keeps input value synced to JS state as a number.
          - @input: Event listener shorthand; triggers updateOpacity() on every slider tick.
        -->
        <input type="range" min="0" max="100" 
               x-model.number="opacity" 
               @input="updateOpacity()" style="width: 100%;">
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS loaded at bottom of body so the #map DOM element exists when initialized -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('mapApp', () => ({
                opacity: 50, // Initial state variable matching the range input default
                map: null,
                orthoLayer: null,

                init() {
                    // Initialize Leaflet Map centered on Toronto
                    this.map = L.map('map').setView([43.6532, -79.3832], 13);

                    // Add OpenStreetMap France raster basemap
                    L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
                        maxZoom: 20,
                        attribution: '&copy; OpenStreetMap France'
                    }).addTo(this.map);

                    // Add City of Toronto 2022 Orthophoto tile layer using initial opacity state
                    this.orthoLayer = L.tileLayer('https://gis.toronto.ca/arcgis/rest/services/basemap/cot_ortho_2022_color_8cm/MapServer/tile/{z}/{y}/{x}', {
                        maxZoom: 20,
                        opacity: this.opacity / 100,
                        attribution: '&copy; City of Toronto GIS'
                    }).addTo(this.map);
                },

                updateOpacity() {
                    // Update Leaflet layer opacity whenever the Alpine state changes
                    if (this.orthoLayer) {
                        this.orthoLayer.setOpacity(this.opacity / 100);
                    }
                }
            }));
        });
    </script>
</body>
</html>
